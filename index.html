<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orgo Exam 3 flashcards</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#202a28;font:17px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:36px 20px}h1{font-size:30px;margin:0 0 5px}p{color:#596763}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.card{background:white;border:1px solid #d5ded7;border-radius:16px;padding:28px;min-height:260px;box-shadow:0 5px 22px #26382c0c}.tag{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#68796c}h2{font-size:26px;margin:18px 0}img{display:block;width:100%;height:auto;margin-top:12px}button{font:inherit;border:1px solid #b6c6ba;background:white;color:#203a2c;border-radius:9px;padding:10px 17px;cursor:pointer}button:hover{background:#e7f1e9}.primary{background:#245b3a;color:white;border-color:#245b3a}.primary:hover{background:#34754e}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hint{font-size:14px} [hidden]{display:none!important}
</style><main><h1>Orgo Exam 3</h1><p>Recall the reaction, then reveal the original course sheet.</p><div class="bar"><span id="progress"></span><button id="shuffle">Shuffle deck</button></div><section class="card"><div class="tag">Reaction</div><h2 id="name"></h2><button class="primary" id="reveal">Show answer</button><img id="answer" alt="Reaction and notes from the course sheet" hidden></section><div class="controls"><button id="prev">Previous</button><button id="next">Next</button></div><p class="hint">Space to reveal · Left and right arrows to move. Radical reactions are excluded.</p></main><script src="cards.js"></script><script>
let deck=[...cards], index=0;const $=id=>document.getElementById(id);function render(){let c=deck[index];$('name').textContent=c.name;$('answer').src=c.image;$('answer').alt=c.name+' from the reaction sheet';$('answer').hidden=true;$('reveal').textContent='Show answer';$('progress').textContent=`Card ${index+1} of ${deck.length}`;}$('reveal').onclick=()=>{let a=$('answer');a.hidden=!a.hidden;$('reveal').textContent=a.hidden?'Show answer':'Hide answer'};function move(n){index=(index+n+deck.length)%deck.length;render()}$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.code==='Space')return;if(e.code==='Space'){e.preventDefault();$('reveal').click()}else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});render();</script></html>
