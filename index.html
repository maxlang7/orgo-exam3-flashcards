<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orgo reaction practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#202a28;font:17px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:30px 20px}h1{font-size:30px;margin:0}p{color:#596763}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #d5ded7;border-radius:16px;padding:24px;min-height:230px}canvas{width:100%;height:auto;display:block;background:white;margin:20px 0}button{font:inherit;border:1px solid #b6c6ba;background:white;color:#203a2c;border-radius:9px;padding:10px 15px;cursor:pointer}button:hover{background:#e7f1e9}.primary{background:#245b3a;color:white}.primary:hover{background:#34754e}.ratings{display:flex;gap:8px;flex-wrap:wrap}.ratings button{flex:1;min-width:130px}.hint{font-size:14px}#answer{width:100%;height:auto} [hidden]{display:none!important}</style><main><h1>Reaction practice</h1><p>Work out the missing reagents or product, then check your answer.</p><div class="bar"><p id="progress"></p><button id="reset">Reset progress</button></div><section class="card"><strong id="question"></strong><canvas id="puzzle" width="1020" height="100" aria-label="Reaction puzzle"></canvas><button class="primary" id="reveal">Show answer</button><div id="solution" hidden><img id="answer" alt="Complete reaction and notes"><p>How well did you know it?</p><div class="ratings"><button data-rating="1">1 · 25%</button><button data-rating="2">2 · 50%</button><button data-rating="3">3 · 75%</button><button data-rating="4">4 · 100%</button></div></div></section><p id="feedback" aria-live="polite"></p><p class="hint">Space reveals the answer. After revealing, press 1, 2, 3 or 4 to rate it. Lower ratings return sooner. Progress is saved in this browser.</p></main><script src="cards.js"></script><script>
// These multi-path diagrams need individual layouts to avoid revealing an answer.
const excluded=new Set([14,18,36]);const deck=cards.map((c,i)=>({...c,id:i+1})).filter(c=>!excluded.has(c.id));const key='orgo-exam3-confidence-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}let current,mode,revealed=false,last=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}function choose(){let weighted=deck.map(c=>({c,w:[8,5,3,1][(state[c.id]||1)-1]}));if(deck.length>1)weighted=weighted.filter(x=>x.c.id!==last);let n=Math.random()*weighted.reduce((a,x)=>a+x.w,0);return weighted.find(x=>(n-=x.w)<0).c}function next(){current=choose();last=current.id;mode=Math.random()<.5?'reagents':'product';revealed=false;$('question').textContent=mode==='reagents'?'What reagents complete this reaction?':'What product forms?';$('solution').hidden=true;$('reveal').hidden=false;$('progress').textContent=`${Object.keys(state).length} of ${deck.length} reactions rated`;let img=new Image();let id=current.id;img.onload=()=>{if(id!==current.id)return;let ctx=$('puzzle').getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1020,100);ctx.drawImage(img,0,30,1020,70,0,0,1020,70);if(mode==='reagents'){ctx.fillStyle='white';ctx.fillRect(200,0,260,70);ctx.fillRect(560,52,460,48);ctx.fillStyle='#245b3a';ctx.font='bold 22px system-ui';ctx.fillText('? reagents',225,40)}else{ctx.fillStyle='white';ctx.fillRect(500,0,520,100);ctx.fillStyle='#245b3a';ctx.font='bold 22px system-ui';ctx.fillText('? product',575,40)}};img.src=current.image;$('answer').src=current.image}function reveal(){if(revealed)return;revealed=true;$('solution').hidden=false;$('reveal').hidden=true}function rate(n){if(!revealed)return;state[current.id]=n;save();$('feedback').textContent=n<4?'Saved. This reaction will come back more often.':'Saved. This reaction will appear less often.';next()}$('reveal').onclick=reveal;document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>rate(Number(b.dataset.rating)));$('reset').onclick=()=>{if(confirm('Clear all confidence ratings on this device?')){state={};save();$('feedback').textContent='Progress cleared.';next()}};document.addEventListener('keydown',e=>{if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();reveal()}else if(/^[1-4]$/.test(e.key))rate(Number(e.key))});next();</script></html>
